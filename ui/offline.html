<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ELION FOOD — Sem conexão</title>
    <style>
      *{box-sizing:border-box}body{margin:0;background:#111a3e;color:#eef4ff;font-family:Segoe UI,Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.card{width:min(520px,calc(100% - 40px));background:#17234c;border:1px solid #314171;border-radius:20px;padding:42px;text-align:center;box-shadow:0 20px 60px #070b1d66}.mark{font-weight:800;letter-spacing:.08em;color:#2bc8b1}.icon{font-size:48px}h1{margin:18px 0 10px;font-size:25px}p{color:#bdc9e8;line-height:1.55}button{margin-top:18px;border:0;border-radius:10px;padding:13px 22px;background:#2bc8b1;color:#071a21;font-weight:800;cursor:pointer}button:hover{filter:brightness(1.08)}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark">ELION FOOD</div>
      <div class="icon" aria-hidden="true">⌁</div>
      <h1>Não foi possível abrir o painel</h1>
      <p>Confira a conexão com a internet. Seus dados continuam seguros e o aplicativo tentará abrir o sistema novamente.</p>
      <button id="retry" type="button">TENTAR NOVAMENTE</button>
    </main>
    <script src="offline.js"></script>
  </body>
</html>
